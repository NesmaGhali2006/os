on:
  push:
    branches:
      - master
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: "printing path"
        run: pwd
      - name: "printing name"
        run: echo Nesma Ghali
      - name: "printing files before"
        run: ls
      - uses: actions/checkout@v3
      - name: "printing files after"
        run: ls
      - name: "docker login"
        run: docker login --username ${{ secrets.DOCKER_USERNAME}} --password ${{ secrets.DOCKER_TOKEN}}
      - name: "building image"
        run: docker build -t ${{ secrets.DOCKER_USERNAME}}/os .

      - name: "push to dockerhub"
        run: docker push ${{ secrets.DOCKER_USERNAME}}/os 


